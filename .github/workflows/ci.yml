name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  # Shared by both required jobs; a passing retry cannot satisfy acceptance.
  MINDBUDGET_RETRY_TESTS_ON_FAILURE: "0"
  # Local complete validation retains the strict 500 ms benchmark.
  MINDBUDGET_SKIP_WALL_CLOCK_BENCHMARK: "1"

jobs:
  ordinary:
    name: Ordinary build and test
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify Xcode toolchain
        run: |
          xcodebuild -version
          xcode_version="$(xcodebuild -version | awk '/^Xcode / { print $2 }')"
          python3 -c 'import sys; version = tuple(map(int, sys.argv[1].split("."))); assert version[0] == 26 and version >= (26, 6), f"Expected Xcode 26.6+, got {sys.argv[1]}"' "${xcode_version}"

      - name: Reject floating-point money paths
        run: Scripts/check-no-floating-point-money.sh

      - name: Verify FX-01 phase and source boundary
        run: Scripts/check-fx01-contract.sh

      - name: Reject unapproved app-owned network egress
        run: Scripts/check-network-egress.sh

      - name: Verify commercialization contracts
        run: Scripts/check-commercialization-docs.sh

      - name: Verify signed public configuration boundary
        run: Scripts/check-public-configuration-contract.sh

      - name: Install public-configuration Worker toolchain
        working-directory: Services/PublicConfigurationWorker
        run: |
          node -e 'const major = Number(process.versions.node.split(".")[0]); if (major < 22) throw new Error(`Expected Node 22+, got ${process.versions.node}`)'
          npm ci

      - name: Audit and verify public-configuration Worker
        working-directory: Services/PublicConfigurationWorker
        run: |
          npm audit --audit-level=high
          npm run check

      - name: Install telemetry Worker toolchain
        working-directory: Services/TelemetryWorker
        run: |
          node -e 'const major = Number(process.versions.node.split(".")[0]); if (major < 22) throw new Error(`Expected Node 22+, got ${process.versions.node}`)'
          npm ci

      - name: Audit and verify telemetry Worker
        working-directory: Services/TelemetryWorker
        run: |
          npm audit --audit-level=high
          npm run check

      - name: Verify telemetry metrics evidence boundary
        run: Scripts/check-telemetry-metrics-contract.sh

      - name: Verify StoreKit local test catalog isolation
        run: Scripts/check-storekit-test-catalog.sh

      - name: Verify iOS 17 deployment target
        run: |
          settings="$(xcodebuild -project MindBudget.xcodeproj -target MindBudget -configuration Debug -showBuildSettings)"
          deployment_target="$(awk -F ' = ' '/^[[:space:]]*IPHONEOS_DEPLOYMENT_TARGET = / { print $2; exit }' <<< "${settings}")"
          test "${deployment_target}" = '17.0'

      - name: Create test simulator
        run: Scripts/create-ci-simulator.sh

      - name: Build and test
        env:
          # The runner context is available at step scope, not in jobs.<job_id>.env.
          MINDBUDGET_RESULT_BUNDLE_PATH: ${{ runner.temp }}/MindBudget.xcresult
        run: Scripts/validate.sh --ci-ordinary-only

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MindBudget-ordinary-xcresult-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/MindBudget.xcresult
          if-no-files-found: error
          retention-days: 14

      - name: Record test report path
        if: always()
        run: |
          echo '### MindBudget validation report' >> "${GITHUB_STEP_SUMMARY}"
          echo '' >> "${GITHUB_STEP_SUMMARY}"
          echo 'Download artifact: `MindBudget-ordinary-xcresult-${{ github.run_id }}-${{ github.run_attempt }}` (retained for 14 days).' >> "${GITHUB_STEP_SUMMARY}"

  fx-ui:
    name: FX UI build and test
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify Xcode toolchain
        run: |
          xcodebuild -version
          xcode_version="$(xcodebuild -version | awk '/^Xcode / { print $2 }')"
          python3 -c 'import sys; version = tuple(map(int, sys.argv[1].split("."))); assert version[0] == 26 and version >= (26, 6), f"Expected Xcode 26.6+, got {sys.argv[1]}"' "${xcode_version}"

      - name: Verify FX contract
        run: Scripts/check-fx01-contract.sh

      - name: Create test simulator
        run: Scripts/create-ci-simulator.sh

      - name: Build and test FX host
        env:
          MINDBUDGET_FX_RESULT_BUNDLE_PATH: ${{ runner.temp }}/MindBudget-FX-UI.xcresult
        run: Scripts/run-fx01-ui-tests.sh "${MINDBUDGET_TEST_DESTINATION}" "${MINDBUDGET_FX_RESULT_BUNDLE_PATH}"

      - name: Upload FX test report and simulator provenance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MindBudget-fx-xcresult-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/MindBudget-FX-UI.xcresult
            ${{ runner.temp }}/MindBudget-FX-UI.simulator.json
          if-no-files-found: error
          retention-days: 14

  acceptance:
    name: Build and test
    needs: [ordinary, fx-ui]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both suites
        env:
          ORDINARY_RESULT: ${{ needs.ordinary.result }}
          FX_UI_RESULT: ${{ needs.fx-ui.result }}
        run: |
          set -euo pipefail
          test "${ORDINARY_RESULT}" = "success"
          test "${FX_UI_RESULT}" = "success"
