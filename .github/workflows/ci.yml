name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Build and test
    runs-on: macos-26
    # Runs land between 18 and 29 minutes on hosted macOS, so a 30-minute budget
    # left no headroom: a normal commit could exceed it purely on runner variance,
    # and GitHub reports that timeout as "cancelled", which reads like a human
    # cancelled the job rather than like a limit being hit.
    timeout-minutes: 45
    env:
      # A newly migrated hosted simulator can time out on its first UI launch.
      # Retry once without weakening any localization assertion.
      MINDBUDGET_RETRY_TESTS_ON_FAILURE: "1"
      # Hosted CPU contention is not a product-performance oracle. CI still runs the
      # deterministic 10,000-row projection contract and skips only the 500 ms clock.
      MINDBUDGET_SKIP_WALL_CLOCK_BENCHMARK: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify Xcode toolchain
        run: |
          xcodebuild -version
          xcode_version="$(xcodebuild -version | awk '/^Xcode / { print $2 }')"
          python3 -c 'import sys; version = tuple(map(int, sys.argv[1].split("."))); assert version[0] == 26 and version >= (26, 6), f"Expected Xcode 26.6+, got {sys.argv[1]}"' "${xcode_version}"

      - name: Reject floating-point money paths
        run: Scripts/check-no-floating-point-money.sh

      - name: Reject unapproved app-owned network egress
        run: Scripts/check-network-egress.sh

      - name: Verify commercialization contracts
        run: Scripts/check-commercialization-docs.sh

      - name: Verify signed public configuration boundary
        run: Scripts/check-public-configuration-contract.sh

      - name: Install public-configuration Worker toolchain
        working-directory: Services/PublicConfigurationWorker
        run: |
          node -e 'const major = Number(process.versions.node.split(".")[0]); if (major < 22) throw new Error(`Expected Node 22+, got ${process.versions.node}`)'
          npm ci

      - name: Audit and verify public-configuration Worker
        working-directory: Services/PublicConfigurationWorker
        run: |
          npm audit --audit-level=high
          npm run check

      - name: Verify StoreKit local test catalog isolation
        run: Scripts/check-storekit-test-catalog.sh

      - name: Verify iOS 17 deployment target
        run: |
          settings="$(xcodebuild -project MindBudget.xcodeproj -target MindBudget -configuration Debug -showBuildSettings)"
          deployment_target="$(awk -F ' = ' '/^[[:space:]]*IPHONEOS_DEPLOYMENT_TARGET = / { print $2; exit }' <<< "${settings}")"
          test "${deployment_target}" = '17.0'

      - name: Create test simulator
        run: |
          xcode_major="$(xcodebuild -version | awk '/^Xcode / { split($2, parts, "."); print parts[1] }')"
          runtime_id="$(xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          required_major = int(sys.argv[1])
          runtimes = [runtime for runtime in json.load(sys.stdin)["runtimes"] if runtime.get("isAvailable") and runtime["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS-") and int(runtime.get("version", "0").split(".")[0]) == required_major]
          if not runtimes:
              raise SystemExit(f"No available iOS {required_major} simulator runtime")
          version = lambda runtime: tuple(map(int, runtime.get("version", "0").split(".")))
          print(max(runtimes, key=version)["identifier"])
          ' "${xcode_major}")"
          device_type_id="$(xcrun simctl list devicetypes -j | python3 -c '
          import json, sys
          device_types = json.load(sys.stdin)["devicetypes"]
          by_name = {device["name"]: device["identifier"] for device in device_types}
          preferred = ("iPhone 17 Pro", "iPhone 17", "iPhone 16 Pro", "iPhone 16")
          selected = next((by_name[name] for name in preferred if name in by_name), None)
          if selected is None:
              selected = next((device["identifier"] for device in device_types if device["name"].startswith("iPhone")), None)
          if selected is None:
              raise SystemExit("No iPhone simulator device type")
          print(selected)
          ')"
          simulator_id="$(xcrun simctl create \
            'MindBudget CI' \
            "${device_type_id}" \
            "${runtime_id}")"
          xcrun simctl boot "${simulator_id}"
          echo "MINDBUDGET_TEST_DESTINATION=platform=iOS Simulator,id=${simulator_id}" >> "${GITHUB_ENV}"

      - name: Build and test
        env:
          # The runner context is available at step scope, not in jobs.<job_id>.env.
          MINDBUDGET_RESULT_BUNDLE_PATH: ${{ runner.temp }}/MindBudget.xcresult
        run: Scripts/validate.sh

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MindBudget-xcresult-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/MindBudget.xcresult
          if-no-files-found: ignore
          retention-days: 14

      - name: Record test report path
        if: always()
        run: |
          echo '### MindBudget validation report' >> "${GITHUB_STEP_SUMMARY}"
          echo '' >> "${GITHUB_STEP_SUMMARY}"
          echo 'Download artifact: `MindBudget-xcresult-${{ github.run_id }}-${{ github.run_attempt }}` (retained for 14 days).' >> "${GITHUB_STEP_SUMMARY}"
