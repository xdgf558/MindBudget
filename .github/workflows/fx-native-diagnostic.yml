name: FX native format diagnostic (not acceptance)

on:
  pull_request:
    paths:
      - .github/workflows/fx-native-diagnostic.yml

permissions:
  contents: read
  actions: read

jobs:
  inspect-prior-bundle:
    name: Read prior failed bundle only
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Check out diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Read one failed binding with hosted Xcode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode_version="$(xcodebuild -version | awk '/^Xcode / { print $2 }')"
          test "${xcode_version}" = '26.6'
          diagnostic_directory="$(mktemp -d)"
          export FX_DIAGNOSTIC_DIRECTORY="${diagnostic_directory}"
          echo "FX_DIAGNOSTIC_DIRECTORY=${diagnostic_directory}" >> "${GITHUB_ENV}"
          gh api repos/xdgf558/MindBudget/actions/artifacts/9943119027/zip > "${diagnostic_directory}/artifact.zip"
          python3 - <<'PY'
          import hashlib, os, pathlib, stat, zipfile
          root = pathlib.Path(os.environ['FX_DIAGNOSTIC_DIRECTORY'])
          archive = root / 'artifact.zip'
          if hashlib.sha256(archive.read_bytes()).hexdigest() != 'fd8225714b4f128a51c382ba805922dfb4b199844ccf327f6f4cbc24dfa18a9e':
              raise SystemExit('The frozen failed-run artifact digest changed')
          with zipfile.ZipFile(archive) as bundle:
              for entry in bundle.infolist():
                  path = pathlib.PurePosixPath(entry.filename)
                  if path.is_absolute() or '..' in path.parts or path.parts[0] != 'MindBudget.xcresult' or stat.S_ISLNK(entry.external_attr >> 16):
                      raise SystemExit('Unsafe or unexpected artifact member')
              bundle.extractall(root)
          PY
          xcrun xcresulttool get test-results tests --path "${diagnostic_directory}/MindBudget.xcresult" --compact > "${diagnostic_directory}/tree.json"
          xcrun xcresulttool get test-results test-details --path "${diagnostic_directory}/MindBudget.xcresult" --test-id 'ForeignCurrencyTests/exponentsOrientationAndEvenOddTiesAreExact()' --compact > "${diagnostic_directory}/detail.json"
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['FX_DIAGNOSTIC_DIRECTORY'])
          tree = json.loads((root / 'tree.json').read_text())
          stack, selected = list(tree['testNodes']), []
          while stack:
              node = stack.pop()
              stack.extend(node.get('children', []))
              if node.get('nodeType') == 'Test Case' and node.get('nodeIdentifier') == 'ForeignCurrencyTests/exponentsOrientationAndEvenOddTiesAreExact()':
                  selected.append(node)
          if len(selected) != 1:
              raise SystemExit('Missing or duplicate diagnostic case')
          report = {
              'scope': 'prior failed run only; not current-head runtime acceptance',
              'sourceRun': '33885693529', 'sourceAttempt': 1,
              'sourceHead': '746008131a939a06b476aa52b1b9f8de02031740',
              'reader': subprocess.check_output(['xcodebuild', '-version'], text=True).strip(),
              'case': selected[0], 'detail': json.loads((root / 'detail.json').read_text()),
          }
          rendered = json.dumps(report, indent=2, sort_keys=True) + '\n'
          (root / 'native-xcode26.json').write_text(rendered)
          print(rendered)
          PY

      - name: Retain native diagnostic (not a passing test bundle)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: FX-native-diagnostic-${{ github.run_id }}
          path: ${{ env.FX_DIAGNOSTIC_DIRECTORY }}/native-xcode26.json
          if-no-files-found: error
          retention-days: 14
